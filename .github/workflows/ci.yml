name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
        working-directory: web
      - run: deno lint
        working-directory: web
      - run: deno check mod.ts
        working-directory: web
      - run: deno test
        working-directory: web
      - name: web/dist is up to date with web/mod.ts
        run: web/build.sh && git diff --exit-code -- web/dist
      - name: package.json and Android version match
        run: deno run -A scripts/check-versions.ts
      - name: schema generator
        run: >-
          deno fmt --check schema && deno lint schema &&
          deno test -A --config schema/deno.json schema
      - name: generated bridge types match schema/example.json
        run: >-
          deno run -A schema/generate.ts &&
          git diff --exit-code --
          examples/web/src/methods.ts
          examples/ios/Sources/ExampleTypes.swift
          examples/android/src/main/kotlin/io/github/kt3k/gawa/example/ExampleTypes.kt
      - run: deno check src/main.ts && ./build.sh
        working-directory: examples/web

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build the example page
        run: examples/web/build.sh
      - name: Test (macOS, incl. end-to-end in WKWebView)
        run: swift test
      - name: Build the library (iOS)
        run: xcodebuild build -scheme Gawa -destination 'generic/platform=iOS' -quiet
      - name: Build the example app (iOS Simulator)
        working-directory: examples/ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project GawaExample.xcodeproj -scheme GawaExample \
            -destination 'generic/platform=iOS Simulator' -quiet

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the example page
        run: examples/web/build.sh
      - name: Unit tests, library, publication, example app
        working-directory: android
        run: >-
          ./gradlew
          :gawa:testDebugUnitTest
          :gawa:assembleRelease
          :gawa:publishReleasePublicationToMavenLocal
          :example:assembleDebug
          :example:assembleDebugAndroidTest

  android-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the example page
        run: examples/web/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End-to-end test in a real WebView (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew :example:connectedDebugAndroidTest
