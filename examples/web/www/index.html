<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>gawa example</title>
    <style>
    body {
      font: 15px/1.5 system-ui, sans-serif;
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
    }
    ul {
      font-family: ui-monospace, monospace;
      list-style: none;
      padding: 0;
    }
    body[data-result="pass"] h1::after {
      content: " ✅";
    }
    body[data-result="fail"] h1::after {
      content: " ❌";
    }
    </style>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <h1>gawa example</h1>
    <ul id="log"></ul>
  </body>
</html>
