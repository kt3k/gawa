# XcodeGen spec: `xcodegen generate` creates GawaExample.xcodeproj.
# Build examples/web first (examples/web/build.sh).
name: GawaExample
options:
  bundleIdPrefix: io.github.kt3k.gawa
  deploymentTarget:
    iOS: "15.0"
packages:
  Gawa:
    path: ../..
targets:
  GawaExample:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../web/www
        type: folder
        buildPhase: resources
    dependencies:
      - package: Gawa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kt3k.gawa.example
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
